name: Godot Source Check

on:
  push:
    branches: [main]
    paths:
      - "GodotProject/**"
      - ".github/workflows/godot-source-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Godot headless editor
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64

      - name: Parse project and import resources
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path GodotProject --quit 2>&1 | tee /tmp/godot-editor.log
          if grep -E "ERROR:|SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-editor.log; then
            echo "Godot editor reported a script or resource error."
            exit 1
          fi

      - name: Run project smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path GodotProject --quit-after 5 2>&1 | tee /tmp/godot-run.log
          if grep -E "ERROR:|SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-run.log; then
            echo "Godot runtime reported a script or resource error."
            exit 1
          fi
