name: Godot Android APK

on:
  # One-time approved build trigger; remove the push trigger after this run completes.
  push:
    branches: [main]
    paths:
      - ".github/workflows/godot-android-apk.yml"
      - "GodotProject/project.godot"
      - "GodotProject/export_presets.cfg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apptya-kingdom-godot-apk
  cancel-in-progress: false

jobs:
  build-apk:
    name: Export and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate debug signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "/usr/local/lib/android/sdk"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/debug.keystore"\n' "$JAVA_HOME" "$RUNNER_TEMP" > "$HOME/.config/godot/editor_settings-4.5.tres"
          python3 - <<'PY'
          import os
          from pathlib import Path
          preset = Path("GodotProject/export_presets.cfg")
          content = preset.read_text()
          marker = "[preset.0.options]\n"
          if marker not in content:
              raise SystemExit("Android export preset options section is missing")
          signing = (
              marker
              + f'keystore/debug="{os.environ["RUNNER_TEMP"]}/debug.keystore"\n'
              + 'keystore/debug_user="androiddebugkey"\n'
              + 'keystore/debug_password="android"\n'
          )
          preset.write_text(content.replace(marker, signing, 1))
          PY

      - name: Export Godot Android APK
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: GodotProject
          use_preset_export_path: true
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true

      - name: Verify APK file and archive
        run: |
          test -s GodotProject/build/Android/ApptyaKingdom.apk
          unzip -t GodotProject/build/Android/ApptyaKingdom.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose GodotProject/build/Android/ApptyaKingdom.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apptya-kingdom-godot-apk
          path: GodotProject/build/Android/ApptyaKingdom.apk
          if-no-files-found: warn
          retention-days: 14
