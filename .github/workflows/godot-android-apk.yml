name: Godot Android APK

on:
  push:
    branches: [main]
    paths:
      - "GodotProject/**"
      - ".github/workflows/godot-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apptya-kingdom-godot-apk
  cancel-in-progress: false

jobs:
  build-apk:
    name: Export and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Export Godot Android APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: GodotProject
          use_preset_export_path: true
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true

      - name: Verify APK file and archive
        run: |
          test -s GodotProject/build/ApptyaKingdom.apk
          unzip -t GodotProject/build/ApptyaKingdom.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose GodotProject/build/ApptyaKingdom.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apptya-kingdom-godot-apk
          path: GodotProject/build/ApptyaKingdom.apk
          if-no-files-found: warn
          retention-days: 14
