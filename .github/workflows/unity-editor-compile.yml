name: Unity Editor Compile Check

on:
  push:
    branches: [main]
    paths:
      - "UnityProject/**"
      - ".github/workflows/unity-editor-compile.yml"
  pull_request:
    branches: [main]
    paths:
      - "UnityProject/**"
      - ".github/workflows/unity-editor-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-editor-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Import and compile in Unity Editor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Unity EditMode compile check
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: UnityProject
          unityVersion: 6000.0.46f1
          testMode: EditMode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Editor Compile Check
          coverageOptions: ''
