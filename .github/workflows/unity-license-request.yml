name: Request Unity License File

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unity-license-request.yml"

permissions:
  contents: read

jobs:
  request-license:
    name: Generate Unity manual activation request
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unity activation request file
        uses: game-ci/unity-request-activation-file@v2
        id: activation
        with:
          unityVersion: 6000.0.46f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-Request
          path: Unity_v6000.0.46f1.alf
          if-no-files-found: error
          retention-days: 7
