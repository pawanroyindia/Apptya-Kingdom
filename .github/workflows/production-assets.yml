name: Generate Production Asset Pack

on:
  push:
    branches: [main]
    paths:
      - "tools/asset_pipeline/**"
      - "GodotProject/main.gd"
      - "GodotProject/kingdom_world.gd"
      - "GodotProject/tests/production_asset_smoke.gd"
      - "GodotProject/tests/kingdom_logic_smoke.gd"
      - ".github/workflows/production-assets.yml"
  workflow_dispatch:

concurrency:
  group: apptya-production-assets-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Blender and Python audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3 python3-numpy ffmpeg
          blender --version
          python3 --version

      - name: Generate UV-mapped PBR models and skeletal animation clips
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python tools/asset_pipeline/generate_models.py

      - name: Download CC0 medieval modules and compose authored buildings
        shell: bash
        run: |
          set -euo pipefail
          KIT_SHA=21104b4045261c28fc312360841ed1a7b0ac8782
          KIT_ROOT="https://raw.githubusercontent.com/J-Ponzo/gltf-medieval-village-megakit/$KIT_SHA"
          KIT_DIR=/tmp/apptya-medieval-kit
          mkdir -p "$KIT_DIR/glTF"
          for module in Wall_UnevenBrick_Door_Round Wall_UnevenBrick_Straight Roof_RoundTiles_6x6 Wall_Plaster_Door_Round Wall_Plaster_Straight; do
            curl --fail --location --retry 3 "$KIT_ROOT/glTF/$module.gltf" --output "$KIT_DIR/glTF/$module.gltf"
            curl --fail --location --retry 3 "$KIT_ROOT/glTF/$module.bin" --output "$KIT_DIR/glTF/$module.bin"
          done
          for texture in T_WoodTrim_Normal.png T_WoodTrim_BaseColor.png T_WoodTrim_Roughness.png T_Plaster_Normal.png T_Plaster_BaseColor.png T_Plaster_ORM.png T_UnevenBrick_Normal.png T_UnevenBrick_BaseColor.png T_UnevenBrick_Roughness.png T_RoundTiles_Normal.png T_RoundTiles_BaseColor.png T_RoundTiles_Roughness.png T_RockTrim_Normal.png T_RockTrim_BaseColor.png T_RockTrim_ORM.png; do
            curl --fail --location --retry 3 "$KIT_ROOT/glTF/$texture" --output "$KIT_DIR/glTF/$texture"
          done
          curl --fail --location --retry 3 "$KIT_ROOT/LICENSE" --output "$KIT_DIR/QUATERNIUS_CC0_1.0.txt"
          # Downscale source kit maps before Blender imports them so mobile GLBs do not embed multi-megabyte 4K textures.
          for texture in T_WoodTrim_Normal.png T_WoodTrim_BaseColor.png T_WoodTrim_Roughness.png T_Plaster_Normal.png T_Plaster_BaseColor.png T_Plaster_ORM.png T_UnevenBrick_Normal.png T_UnevenBrick_BaseColor.png T_UnevenBrick_Roughness.png T_RoundTiles_Normal.png T_RoundTiles_BaseColor.png T_RoundTiles_Roughness.png T_RockTrim_Normal.png T_RockTrim_BaseColor.png T_RockTrim_ORM.png; do
            ffmpeg -hide_banner -loglevel error -y -i "$KIT_DIR/glTF/$texture" -vf "scale=512:512:flags=lanczos" -frames:v 1 "$KIT_DIR/glTF/resized-$texture"
            mv "$KIT_DIR/glTF/resized-$texture" "$KIT_DIR/glTF/$texture"
          done
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python tools/asset_pipeline/compose_authored_buildings.py
          cp "$KIT_DIR/QUATERNIUS_CC0_1.0.txt" GodotProject/assets/production/source_models/QUATERNIUS_CC0_1.0.txt

      - name: Generate mixed stereo soundtrack and game effects
        run: |
          python3 tools/asset_pipeline/generate_audio.py

      - name: Integrate authored CC0 characters and sampled game effects
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=8ad1c93e382e2a6a5755882c1b9b2922877fab6e
          ROOT="https://raw.githubusercontent.com/Hakhyun-Kim/constellation-defense/$SOURCE_SHA/assets"
          MODEL_DIR="GodotProject/assets/production"
          SFX_DIR="$MODEL_DIR/source_sfx"
          mkdir -p "$SFX_DIR" "$MODEL_DIR/source_models"
          for model in warrior ranger gate-tower; do
            curl --fail --location --retry 3 "$ROOT/models/quaternius-$model.glb" --output "/tmp/quaternius-$model.glb"
          done
          cp "$MODEL_DIR/royal_captain.glb" "$MODEL_DIR/source_models/royal_captain_generated.glb"
          cp "$MODEL_DIR/kingdom_guard.glb" "$MODEL_DIR/source_models/kingdom_guard_generated.glb"
          cp "$MODEL_DIR/watchtower.glb" "$MODEL_DIR/source_models/watchtower_generated.glb"
          # Preserve the pinned CC0 references, but use the project's authored, rigged characters
          # as runtime assets so the actual game ships the bespoke geometry and animation clips.
          cp /tmp/quaternius-warrior.glb "$MODEL_DIR/source_models/quaternius-warrior-reference.glb"
          cp /tmp/quaternius-ranger.glb "$MODEL_DIR/source_models/quaternius-ranger-reference.glb"
          cp /tmp/quaternius-gate-tower.glb "$MODEL_DIR/watchtower.glb"
          declare -A MAP=(
            [gather]="kenney-coins"
            [build]="kenney-place"
            [victory]="kenney-crit-metal"
            [defeat]="kenney-hero-hurt"
            [train]="kenney-block-heavy"
            [scout]="kenney-knife-slice"
          )
          for sound in "${!MAP[@]}"; do
            sample="${MAP[$sound]}"
            curl --fail --location --retry 3 "$ROOT/audio/$sample.ogg" --output "$SFX_DIR/$sample.ogg"
            ffmpeg -hide_banner -loglevel error -y -i "$MODEL_DIR/audio/$sound.wav" -i "$SFX_DIR/$sample.ogg" -filter_complex "[0:a]volume=0.78[a];[1:a]volume=0.58[b];[a][b]amix=inputs=2:duration=shortest:dropout_transition=0:normalize=0,alimiter=limit=0.96[mix]" -map "[mix]" -ar 22050 -ac 2 -c:a pcm_s16le "/tmp/$sound-mixed.wav"
            mv "/tmp/$sound-mixed.wav" "$MODEL_DIR/audio/$sound.wav"
          done
          MUSIC_DIR="$MODEL_DIR/source_music"
          mkdir -p "$MUSIC_DIR"
          curl --fail --location --retry 3 "https://opengameart.org/sites/default/files/once_upon_a_time_loop_0.mp3" --output "$MUSIC_DIR/once_upon_a_time_loop_0.mp3"
          # Keep the CC0 MP3 as an optional, licensed reference asset. The runtime WAV remains
          # the original score rendered by tools/asset_pipeline/generate_audio.py above.
          # Do not overwrite the original composition with a third-party track.
          cat > "$MODEL_DIR/ASSET_PROVENANCE.md" <<'EOF'
          # Apptya Kingdom generated assets and third-party provenance
          - Royal Captain and guard runtime meshes are generated by `tools/asset_pipeline/generate_models.py`, with original layered armor details, UVs, PBR maps, weighted armatures and Idle/Walk/Attack clips. Pinned Quaternius CC0 characters are retained as comparison/reference assets under `source_models/`, not used as the runtime hero/guard.
          - Watchtower: Quaternius Medieval Village MegaKit gate-tower model. Keep and barracks are assembled from the kit's textured wall/roof modules; source PBR textures are resized to 512px for mobile.
          - Sound samples: Kenney RPG Audio / Impact Sounds selections, CC0 1.0 Universal. Source OGG files are retained in `source_sfx/`; runtime effects mix licensed source recordings with the project's original synthesized layers. These are not represented as a custom human-recorded Foley session.
          - Kingdom score: original procedurally composed 36-second stereo score from `tools/asset_pipeline/generate_audio.py`. The TAD CC0 track is retained as an optional reference only and is not the runtime theme; this is not a commissioned orchestral recording.
          - Sources and licenses: https://quaternius.com/packs/rpgcharacters.html ; https://quaternius.com/packs/medievalvillagemegakit.html ; https://kenney.nl/assets/rpg-audio ; https://kenney.nl/assets/impact-sounds ; https://opengameart.org/content/once-upon-a-time-loop
          EOF

      - name: Verify asset outputs and animation exports
        shell: bash
        run: |
          set -euo pipefail
          test -s GodotProject/assets/production/royal_captain.glb
          test -s GodotProject/assets/production/kingdom_guard.glb
          test -s GodotProject/assets/production/keep.glb
          test -s GodotProject/assets/production/barracks.glb
          test -s GodotProject/assets/production/watchtower.glb
          test -s GodotProject/assets/production/source_models/keep_generated.glb
          test -s GodotProject/assets/production/source_models/barracks_generated.glb
          test -s GodotProject/assets/production/source_models/QUATERNIUS_CC0_1.0.txt
          test "$(stat -c %s GodotProject/assets/production/keep.glb)" -gt 100000
          test "$(stat -c %s GodotProject/assets/production/keep.glb)" -lt 20000000
          test "$(stat -c %s GodotProject/assets/production/barracks.glb)" -gt 100000
          test "$(stat -c %s GodotProject/assets/production/barracks.glb)" -lt 20000000
          test -s GodotProject/assets/production/audio/kingdom_theme.wav
          for sound in gather build train victory defeat scout; do test -s "GodotProject/assets/production/audio/$sound.wav"; done
          test "$(find GodotProject/assets/production/textures -name '*.png' | wc -l)" -ge 30
          python3 - <<'PY'
          import array, os, wave
          base="GodotProject/assets/production"
          files=["audio/kingdom_theme.wav","audio/gather.wav","audio/build.wav","audio/train.wav","audio/victory.wav","audio/defeat.wav","audio/scout.wav"]
          for f in files:
              with wave.open(os.path.join(base,f),"rb") as w:
                  channels, rate, frames = w.getnchannels(), w.getframerate(), w.getnframes()
                  assert channels == 2 and rate == 22050 and frames > 1000, f
                  duration = frames / rate
                  assert (30.0 <= duration <= 40.0) if f.endswith("kingdom_theme.wav") else (0.12 <= duration <= 3.0), (f, duration)
                  samples = array.array("h")
                  samples.frombytes(w.readframes(frames))
                  peak = max(abs(v) for v in samples)
                  rms = (sum(v*v for v in samples) / len(samples)) ** 0.5
                  assert peak > 200 and rms > 40, (f, peak, rms)
                  assert peak < 32760, (f, peak)
                  print(f"{f}: {duration:.2f}s peak={peak} rms={rms:.0f}")
          print("APPTYA_ASSET_OUTPUTS_VALID")
          PY

      - name: Import final assets and run full production regression suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          GODOT=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          "$GODOT" --headless --editor --path GodotProject --quit
          "$GODOT" --headless --path GodotProject --script res://tests/production_asset_smoke.gd
          "$GODOT" --headless --path GodotProject --script res://tests/kingdom_logic_smoke.gd

      - name: Commit generated models, textures and audio into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GodotProject/assets/production
          if git diff --cached --quiet; then
            echo "Generated assets already match repository."
          else
            git commit -m "Add generated UV-mapped kingdom assets and mixed audio pack"
            # Other source fixes can land while Blender and audio rendering run.
            # Rebase the generated asset commit onto the latest main before publishing.
            git fetch origin main
            # If another successful run already added these generated asset paths,
            # prefer the freshly regenerated and fully tested asset blobs.
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
